# Publishes the sendio gem to RubyGems when a vX.Y.Z tag lands on the public
# copy of this SDK (send-io/sendio-ruby), with the API key in the
# RUBYGEMS_API_KEY secret. The gem sets rubygems_mfa_required, so RubyGems
# refuses a plain key push that has no one-time code.
# Later upgrade: RubyGems trusted publishing (OIDC), which needs no stored key
# and works with MFA.
#
# A manual run only checks that RubyGems accepts the key for a push. It builds
# and publishes nothing.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Tag must match lib/sendio/version.rb
        run: test "v$(ruby -r ./lib/sendio/version -e 'print Sendio::VERSION')" = "$GITHUB_REF_NAME"
      - run: bundle exec rspec
      - run: gem build sendio.gemspec
      - run: gem push sendio-*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  rubygems-key-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # A push request with an empty body, so there is no gem to publish.
      # RubyGems checks the key (and the one-time code demand) before it reads
      # the body: 422 means a real push would get through. Prints RubyGems'
      # answer, never the key (this log is public).
      - name: Ask RubyGems whether it accepts the key for a push
        env:
          KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set -eu
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST -H "Authorization: $KEY" -H 'Content-Type: application/octet-stream' --data-binary '' https://rubygems.org/api/v1/gems)
          msg=$(head -c 300 resp.txt); rm -f resp.txt
          if [ "$code" = 422 ]; then echo "RubyGems: HTTP $code, the key is accepted for a push"
          else echo "RubyGems: HTTP $code $msg"; exit 1; fi
