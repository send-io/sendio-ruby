# Publishes the sendio gem to RubyGems when a vX.Y.Z tag lands on the public
# copy of this SDK (send-io/sendio-ruby), through RubyGems trusted publishing
# (OIDC): no stored key, and it works with the gem's rubygems_mfa_required.
# RubyGems trusts exactly this repository and this workflow file name
# (rubygems.org, gem sendio, Trusted publishers), so do not rename the file.
#
# A manual run only checks that RubyGems accepts this workflow's identity.
# It builds and publishes nothing.

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Tag must match lib/sendio/version.rb
        run: test "v$(ruby -r ./lib/sendio/version -e 'print Sendio::VERSION')" = "$GITHUB_REF_NAME"
      - run: bundle exec rspec
      - run: gem build sendio.gemspec
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem push sendio-*.gem

  rubygems-trust-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Trades this run's GitHub identity for a short-lived RubyGems key. The
      # step fails when RubyGems does not trust this repository and workflow.
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: echo "RubyGems accepted this workflow as a trusted publisher"
